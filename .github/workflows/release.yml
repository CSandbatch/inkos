name: Stage npm release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-and-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm docs:check
      - run: pnpm diagrams:check
      - run: pnpm copy:lint

      - name: Verify tag and package versions
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/set-package-versions.mjs "$VERSION" --root .
          pnpm verify:publish-manifests
          test "$(node -p "require('./packages/core/package.json').version")" = "$VERSION"
          test "$(node -p "require('./packages/studio/package.json').version")" = "$VERSION"
          test "$(node -p "require('./packages/cli/package.json').version")" = "$VERSION"

      - name: Pack immutable release tarballs
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-tarballs
          npm pack ./packages/core --pack-destination release-tarballs
          npm pack ./packages/studio --pack-destination release-tarballs
          npm pack ./packages/cli --pack-destination release-tarballs
          sha256sum release-tarballs/*.tgz > release-tarballs/SHA256SUMS
          for archive in release-tarballs/*.tgz; do
            if tar -xOf "$archive" package/package.json | grep -q '"workspace:'; then
              echo "FATAL: $archive contains a workspace protocol"
              exit 1
            fi
          done

      - name: Smoke test the exact CLI tarball
        shell: bash
        run: |
          set -euo pipefail
          TEST_DIR=$(mktemp -d)
          npm init --yes --prefix "$TEST_DIR"
          npm install --prefix "$TEST_DIR" "$GITHUB_WORKSPACE"/release-tarballs/actalk-novelgraph-core-*.tgz
          npm install --prefix "$TEST_DIR" "$GITHUB_WORKSPACE"/release-tarballs/actalk-novelgraph-studio-*.tgz
          npm install --prefix "$TEST_DIR" "$GITHUB_WORKSPACE"/release-tarballs/actalk-novelgraph-0*.tgz
          "$TEST_DIR/node_modules/.bin/novelgraph" --version

      - uses: actions/upload-artifact@v4
        with:
          name: npm-release-${{ github.ref_name }}
          path: release-tarballs
          if-no-files-found: error
          retention-days: 30

  publish-canary:
    runs-on: ubuntu-latest
    needs: verify-and-pack
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-release-${{ github.ref_name }}
          path: release-tarballs

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14
          registry-url: https://registry.npmjs.org

      - run: npm install --global npm@11.18.0
      - run: sha256sum --check release-tarballs/SHA256SUMS

      # Publish one immutable version under canary. Promoting these exact versions
      # to latest is an interactive dist-tag operation because npm OIDC deliberately
      # does not authorize dist-tag changes.
      - name: Publish exact artifacts under canary
        shell: bash
        run: |
          set -euo pipefail
          npm publish release-tarballs/actalk-novelgraph-core-*.tgz --tag canary --access public
          npm publish release-tarballs/actalk-novelgraph-studio-*.tgz --tag canary --access public
          npm publish release-tarballs/actalk-novelgraph-0*.tgz --tag canary --access public

  verify-canary:
    runs-on: ubuntu-latest
    needs: publish-canary
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14
          registry-url: https://registry.npmjs.org

      - name: Verify registry artifacts and clean installation
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          for PACKAGE in @actalk/novelgraph-core @actalk/novelgraph-studio @actalk/novelgraph; do
            ACTUAL=""
            for _ in 1 2 3 4 5 6; do
              ACTUAL=$(npm view "$PACKAGE@canary" version 2>/dev/null || true)
              [ "$ACTUAL" = "$VERSION" ] && break
              sleep 10
            done
            test "$ACTUAL" = "$VERSION"
          done
          TEST_DIR=$(mktemp -d)
          npm init --yes --prefix "$TEST_DIR"
          npm install --prefix "$TEST_DIR" "@actalk/novelgraph@$VERSION"
          "$TEST_DIR/node_modules/.bin/novelgraph" --version

      - name: Promotion instructions
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "## Canary verified"
            echo "The exact $VERSION artifacts passed registry installation."
            echo "An authenticated maintainer must now run:"
            echo '```bash'
            echo "npm dist-tag add @actalk/novelgraph-core@$VERSION latest"
            echo "npm dist-tag add @actalk/novelgraph-studio@$VERSION latest"
            echo "npm dist-tag add @actalk/novelgraph@$VERSION latest"
            echo '```'
            echo "Then run the Promote npm release workflow for $VERSION."
          } >> "$GITHUB_STEP_SUMMARY"
