name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-test-and-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.5
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Verify publishable tarballs
        shell: bash
        run: |
          set -euo pipefail
          for pkg in packages/core packages/studio packages/cli; do
            pack_dir=$(mktemp -d)
            (cd "$pkg" && npm pack --pack-destination "$pack_dir")
            package_json=$(tar -xOf "$pack_dir"/*.tgz package/package.json)
            if echo "$package_json" | grep -q '"workspace:'; then
              echo "workspace protocol leaked into $pkg tarball"
              exit 1
            fi
          done
      - name: Scan public product text
        shell: bash
        run: |
          if rg -n 'Narcooo|[\p{Han}]|â€”|Â·|ä¸' README.md CHANGELOG.md CONTRIBUTING.md SECURITY.md SUPPORT.md PRIVACY.md packages/site packages/studio/src/client .github/ISSUE_TEMPLATE; then
            echo "Stale ownership, CJK text, or mojibake found in a public surface"
            exit 1
          fi
