name: Bug Report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug clearly. Include the exact error message if any.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the issue.
      placeholder: |
        1. npx @actalk/novelgraph studio --no-open
        2. Create a local project
        3. Open Manuscript or DAG control
        4. See error: ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: NovelGraph version
      description: Output of `novelgraph --version`
      placeholder: "0.5.0-source or commit SHA"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows (WSL)
        - Windows (native)
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: LLM provider / model
      description: e.g. openai/gpt-4o, anthropic/claude-sonnet, ollama/qwen3:8b
      placeholder: "openai/gpt-4o"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any error output, truncated chapter content, or debug logs.
      render: shell
    validations:
      required: false
